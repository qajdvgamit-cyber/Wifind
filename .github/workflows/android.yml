# Builds the WiFind Android app on GitHub every time you push, then publishes it as WiFind.apk
# under Releases, at a link that never changes:
#   https://github.com/<your-username>/<your-repo>/releases/latest/download/WiFind.apk
name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        working-directory: android
        run: bash ./gradlew assembleRelease --no-daemon

      - name: Name the file WiFind.apk
        run: cp android/app/build/outputs/apk/release/app-release.apk WiFind.apk

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: WiFind-apk
          path: WiFind.apk

      - name: Publish it under Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest WiFind.apk \
            --title "WiFind for Android" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. On your phone, download WiFind.apk, open it, and allow installing from this source." \
            --target "$GITHUB_SHA" \
            --latest
